# conf/config.yaml
#
run_name: test-1
project: diff-blocks

stage: train
data_name: cifar100
image_size: null
num_labels: null

model_type: vit

devices: 1
num_epochs: 50
block_idx: 3

batch_size: 128
eval_batch_size: null
num_workers: 8

add_rand_aug: false
gradient_checkpointing: false

save_every_n_epochs: 50
save_top_k: 1
accumulate_grad_batches: 1

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 0.00005

lr: 0.0005
weight_decay: 0.01
optimizer: adamw

deepspeed: false
seed: 42
ckpt_path: null
debug: false
postfix: "-rand-augment"

attention_visualization:
  enabled: false
  save_local: true
  log_to_wandb: true
  output_dir: attention_maps
  every_n_steps: 100
  max_batches: null
  max_layers: null
  max_heads: 12
  sample_idx: 0

# dblock
num_blocks: 4
gamma: 0.05
num_inference_steps: 3
cfg_scale: 0.0
class_dropout_prob: 0.0
transition: null
num_layers: 12
alternative: null
